{% load static %}
<header class="site-header" role="banner">
    <div class="header-container">
        <div class="logo">
            <a href="/">
                <img src="{% static 'images/a2-logo-favicon.webp' %}" alt="Nimo Digital" class="logo-img" loading="eager" data-sticky-src="{% static 'images/a2-logo-favicon.webp' %}">
                <span class="sr-only">Nimo Digital</span>
            </a>
        </div>

        <nav class="primary-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#home" class="nav-link active">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'about' %}" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#services" class="nav-link">Services</a>
                </li>
                <li class="nav-item">
                    <a href="#portfolio" class="nav-link">Portfolio</a>
                </li>
                <li class="nav-item">
                    <a href="#contact" class="nav-link">Contact</a>
                </li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="#contact" class="btn-cta">Let's Get Start</a>
            <button class="mobile-menu-toggle" aria-label="Toggle menu" aria-controls="mobile-menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="mobile-menu-overlay" aria-hidden="true">
        <nav class="mobile-nav" role="navigation" aria-label="Mobile menu">
            <ul class="mobile-nav-list">
                <li class="mobile-nav-item">
                    <a href="#home" class="mobile-nav-link active">Home</a>
                </li>
                <li class="mobile-nav-item">
                    <a href="#about" class="mobile-nav-link">About</a>
                </li>
                <li class="mobile-nav-item">
                    <a href="#services" class="mobile-nav-link">Services</a>
                </li>
                <li class="mobile-nav-item">
                    <a href="#portfolio" class="mobile-nav-link">Portfolio</a>
                </li>
                <li class="mobile-nav-item">
                    <a href="#pricing" class="mobile-nav-link">Pricing</a>
                </li>
                <li class="mobile-nav-item">
                    <a href="#contact" class="mobile-nav-link">Contact</a>
                </li>
            </ul>
            <a href="#contact" class="btn-cta mobile-cta">Let's Get Start</a>
        </nav>
    </div>
</header>
